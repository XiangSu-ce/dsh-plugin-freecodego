# Latest Harness composition. It leaves the official controller and
# model-selection entries authoritative and only inserts FreeCodeGo surfaces —
# including the official `llm-deepseek` and `web-search-deepseek` rows, which
# the base composition names by provider id.
# Kept enabled for the reason recorded in `cordis.patch.yml`: the base
# composition pins `web.searchProvider: deepseek-official` and this row is the
# only provider that can answer it.
- insert:
    - id: freecodego-harness-plugin
      name: '@deepseek-ai/dsh-freecodego-harness-plugin'
      config: {}
    - id: freecodego-agent-engine-router
      name: '@deepseek-ai/dsh-freecodego-agent-engine-router'
      config: {}
    - id: freecodego-harness-ui
      name: '@deepseek-ai/dsh-freecodego-harness-ui'
